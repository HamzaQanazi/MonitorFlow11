openapi: 3.0.3

# ─────────────────────────────────────────────────────────────────────────────
# Operiva / MonitorFlow — FROZEN API CONTRACT (skeleton, step-1 of migration)
#
# This file is the source of truth (CLAUDE.md invariant I7). Two developers
# build against it in parallel; a unilateral change silently breaks the other
# half. Changes require BOTH developers to agree.
#
# Ratified stack (2026-07-15): Node.js + Express (JavaScript), raw SQL. No
# Prisma, no NestJS, no TypeScript codegen from this file — it is a hand-kept
# contract, validated in review, not a generator input.
#
# SKELETON: the generic engine endpoints that prove the thesis are specified;
# request/response bodies are sketched to the shape the invariants require, not
# yet field-complete. Fill in per-endpoint as each is built. Nothing here is
# sector-specific — that is the whole point.
#
# PHASE 4 SHIPPED (2026-07-16) — the transition model is live:
#   • status `category` is GONE everywhere; the cross-service vocabulary is
#     `is_terminal` (API: status {key, label, isTerminal}); dashboards/reports
#     group open vs closed; list filter `state=open|closed` replaces
#     `category=`.
#   • transitions are keyed and gated by exactly one of `required_capability`
#     (Gate 1) or `actor` (requester|assignee) — see TransitionDef.
#   • GET/POST /requests/{id}/transitions serve the actor parties; the old
#     /tasks/{id}/{accept,reject,complete,status,valid-transitions} and
#     /requests/{id}/resolution endpoints are deleted.
#   • oversight override (PATCH /requests/{id}/status) loosened: any existing
#     non-initial, non-current status is a legal target ('override' cap +
#     note); the category-based reject-vs-reopen distinction went with
#     category.
#   • still dedicated until Phase 5/7: /requests/{id}/{assign,priority,status},
#     /candidates, assignee-as-transition (assignee_id below).
#
# PHASE 5 SHIPPED (2026-07-16) — relational notifications + tree SLA:
#   • transition `notify` lists RELATIONSHIP targets resolved at fire time
#     (created_by | assigned_to | assignee_manager); notify_oversight is gone.
#   • statuses carry `sla_minutes` (null = no SLA); a breach escalates to the
#     assignee's manager (fallback: service owner); the completion-target
#     status nudges the requester. Service-level escalate_* columns dropped.
#   • notification `message` is bilingual {en, ar}.
#
# PIVOT v7 (2026-07) — single-company workforce app + first-login onboarding:
#   • REMOVED: the JSON config API (POST/GET /config/services) and outbound signed
#     webhooks (/config/webhooks). Those path + schema blocks are stripped below.
#   • ADDED: GET /onboarding/options (the wizard catalogue) and
#     PATCH /company/onboarding (the Owner's one save; flips onboarding_completed).
#     onboardingCompleted now rides on the /auth/login and /auth/me user payloads.
#   • Employee management is reconciled to the live routes: all under /employees
#     (people tag, manage_employees capability). The old /config/{org,levels,
#     capabilities,employees} paths are removed — levels/org/capabilities have no
#     live endpoint post-pivot (Gate-1 level config is seed-time only for now).
#     Still undocumented (out of this pass): /users/me*.
#   • /departments: full CRUD (Owner-only create/rename/delete/reassign-head,
#     read open to admin + view_all) documented alongside the department-head
#     fallback added to PATCH /employees/{id}/deactivate.
#
# PHASE 7 (2026-07-17) — SUPERSEDED by the v7 pivot (config API + webhooks removed).
#
# PHASE 6 SHIPPED (2026-07-16) — PostGIS: request.location is
# GEOGRAPHY(Point,4326) + GIST (migration 009); the wire shape is unchanged —
# location still reads/writes as {lat, lng}.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Operiva API
  version: 0.1.0-skeleton
  description: >
    Single-company workforce and field-operations platform (pivot v7). The buyer
    is provisioned an Owner at purchase and runs a first-login onboarding wizard
    (GET /onboarding/options, PATCH /company/onboarding). The operational engine
    stays configuration-driven: clients are thin renderers — forms come from the
    stored definition, action buttons come from /requests/{id}/transitions (both
    permission gates already applied server-side).

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: onboarding      # v7: first-login wizard catalogue + company save
  - name: services        # read the stored form/workflow definition for rendering
  - name: requests        # the generic lifecycle — one engine, every sector
  - name: people          # employees, the reporting tree (manage_employees capability)
  - name: notifications
  - name: files
  - name: timeclock       # employee self-service: clock in/out, breaks, manual hours, in-shift entries
  - name: schedule        # manager roster (shift templates + per-date assignment) + employee "my schedule"
  - name: knowledge-base  # company article list (communication feature group) — read company-wide, write needs view_all/admin
  - name: events          # company calendar + self-service RSVP (communication feature group)
  - name: translate       # bilingual auto-fill assist (Gemini proxy) — CLAUDE.md §13, 2026-08-21 exception
  - name: dashboard       # oversight overview: stats + 30-day chart (view_all/admin)

paths:
  # ── Auth ───────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Log in with a generic login_identifier (email OR employee number)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_identifier, password]
              properties:
                login_identifier: { type: string, example: "1101", description: "An employee's 4-digit number, or an external user's email." }
                password: { type: string, format: password }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Login rate limit exceeded }

  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: Self-register — creates a `user` account only. Employees are seeded/created by an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_identifier, password, name]
              properties:
                login_identifier: { type: string, format: email }
                password: { type: string, format: password }
                name: { type: string }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '409': { description: login_identifier already taken }

  /auth/me:
    get:
      tags: [auth]
      summary: Current account, including level + capabilities (for UX only — server re-checks)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [auth]
      security: []
      summary: >
        Self-service reset, step 1 (CLAUDE.md §13 re-scope, supervisor-directed).
        Always responds 200 with the same body whether or not `identifier`
        matches an account — never reveals existence. If it does match, emails
        a single-use, 1-hour-expiry reset link to that account's `email`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string, description: "The same value used to log in — an employee number or an email." }
      responses:
        '200':
          description: Always returned, regardless of whether the identifier matched
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { description: Reset request rate limit exceeded }

  /auth/reset-password:
    post:
      tags: [auth]
      security: []
      summary: Self-service reset, step 2 — consumes the token from the emailed link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, description: "The raw token from the emailed reset link." }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        '422': { $ref: '#/components/responses/Validation' }

  # ── Onboarding wizard (v7) — first-login company setup ───────────────────────
  /onboarding/options:
    get:
      tags: [onboarding]
      summary: >
        The static wizard catalogue (any authenticated caller): employee ranges,
        industries + their sub-industries, and feature groups — all {en,ar}
        labels. The thin client renders this; the save re-validates against it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  employeeRanges:
                    type: array
                    items: { type: string }
                  industries:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { $ref: '#/components/schemas/LocalizedText' }
                        subs:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              label: { $ref: '#/components/schemas/LocalizedText' }
                  featureGroups:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { $ref: '#/components/schemas/LocalizedText' }
                        features:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              label: { $ref: '#/components/schemas/LocalizedText' }
                  plans:
                    type: array
                    description: >
                      Step-7 plan tiers. Descriptive only for now — employeeCap
                      and featureGroups are not enforced server-side (no billing,
                      no gating; see CLAUDE.md §13).
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        name: { $ref: '#/components/schemas/LocalizedText' }
                        employeeCap: { type: integer, nullable: true, description: null = unlimited }
                        featureGroups:
                          type: array
                          items: { type: string, description: a featureGroups key }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /onboarding/geocode:
    get:
      tags: [onboarding]
      summary: >
        Step-1 address helper: server-side proxy to OpenStreetMap Nominatim
        (never called directly from the browser — Nominatim's usage policy
        requires a descriptive User-Agent and ~1 req/sec throttling, both
        enforced here). Returns only a normalized { city, country } match, never
        the raw upstream response.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3 }
      responses:
        '200':
          description: OK (match is null when nothing found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    type: object
                    nullable: true
                    properties:
                      city: { type: string }
                      country: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /company:
    get:
      tags: [onboarding]
      summary: >
        The company's current settings plus its branch list (each flagged
        inUse when a department points at it). Owner/admin only. Backs the
        console's Settings page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [onboarding]
      summary: >
        Edit the company settings after onboarding (Owner/admin only).
        CLAUDE.md S15 listed "onboarding is one-shot with no in-app edit" as a
        documented limitation; re-scoped 2026-08-22 by explicit decision, since
        the documented workaround was hand-editing a live database and three of
        the wizard's answers (features, logo, branches) were otherwise
        permanent. Full replace, validated against the same catalogue the
        onboarding save uses. Onboarding itself stays one-shot: this never
        touches onboarding_completed, and PATCH /company/onboarding still 409s.
        Branches are a full replace too - a row with an id renames it, one
        without inserts, and an omitted id deletes it (409 if a department
        still points at it). Downgrading to a plan whose employeeCap is below
        the current active headcount is refused (422), the same limit
        POST /employees enforces on hire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, ownerJobTitle, phone, employeeRange, industry, subIndustry, emailDomain, plan, features, branches]
              properties:
                name: { $ref: '#/components/schemas/LocalizedText' }
                address: { $ref: '#/components/schemas/LocalizedText' }
                ownerJobTitle: { $ref: '#/components/schemas/LocalizedText' }
                phone: { type: string }
                employeeRange: { type: string }
                industry: { type: string }
                subIndustry: { type: string }
                emailDomain: { type: string, description: affects logins generated from now on; existing rows keep theirs }
                plan: { type: string }
                features:
                  type: array
                  items: { type: string }
                  minItems: 1
                logoFileId: { type: string, nullable: true, description: omit to keep the current logo; must be an image }
                branches:
                  type: array
                  minItems: 1
                  description: same flat {en, ar} the onboarding save takes, plus an optional id
                  items:
                    type: object
                    properties:
                      id: { type: integer, description: omit to create a new branch }
                      en: { type: string }
                      ar: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A department still belongs to a branch being removed }
        '422': { $ref: '#/components/responses/Validation' }

  /company/onboarding:
    patch:
      tags: [onboarding]
      summary: >
        The wizard's one save (Owner/admin only). Validates every pick against the
        catalogue server-side (I8), writes the single company row + its branches in
        one transaction, then flips onboarding_completed. One-shot — a second call
        after completion is 409. Optional logoFileId is a parentless file_attachment
        the Owner POSTed to /files first - it must be an IMAGE (the console
        wordmark renders it in an <img> via a data URI, so the general /files
        allowlist's PDFs would be a broken image forever). `features` must name
        at least one module: an empty set leaves the deployment with no module
        routes at all. Also parks any department that has no branch yet in the
        first branch created here, and writes a company.onboarded audit row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, ownerJobTitle, employeeRange, industry, subIndustry, branches, phone, plan, emailDomain]
              properties:
                name: { $ref: '#/components/schemas/LocalizedText' }
                address: { $ref: '#/components/schemas/LocalizedText' }
                ownerJobTitle: { $ref: '#/components/schemas/LocalizedText' }
                employeeRange: { type: string, description: one of options.employeeRanges }
                industry: { type: string, description: an industry key }
                subIndustry: { type: string, description: a sub-industry key of the chosen industry }
                branches:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/LocalizedText' }
                features:
                  type: array
                  items: { type: string, description: a feature key }
                logoFileId: { type: string, format: uuid, nullable: true }
                phone: { type: string }
                plan: { type: string, description: one of options.plans (step 7) }
                emailDomain:
                  type: string
                  description: >
                    Step 5. Domain suffix for generated employee login emails
                    (e.g. 'company.org' → 'ha.qanazi@company.org').
      responses:
        '200':
          description: Onboarding complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboardingCompleted: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  # ── Services (read, for rendering) ───────────────────────────────────────────
  /services:
    get:
      tags: [services]
      summary: Services the caller may submit to (respects accepts_external_users)
      parameters:
        - name: includeDisabled
          in: query
          required: false
          schema: { type: boolean }
          description: >
            Admin-only. Include disabled services in the list. Without it a
            service switched off via PATCH /services/{id}/enabled disappeared
            from every list, so nothing could re-enable it. Powers the console's
            Services page.
        - name: owned
          in: query
          required: false
          schema: { type: boolean }
          description: >
            When true, restrict to services the caller oversees — owner_id in
            their subtree (Gate 2). Powers the monitor Requests/Reports filter
            dropdowns so they never offer a service the caller can't see rows for.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceSummary' }
    post:
      tags: [services]
      summary: >
        The "Add Service" builder's one save (admin-only, requireRole('admin')
        — a config action, not oversight, so no capability). Validates the
        whole shape server-side (I8) through the same seed-time validators
        (formSchema.js/workflowSchema.js) and writes service_type + both
        form_definition rows + workflow_definition in one transaction. No
        edit-in-place — see PATCH /services/{id}/enabled; to change a live
        definition, create a new service and disable the old one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, departmentId, defaultPriority, acceptsExternalUsers, acceptsEmployeeSubmitters, ownerId, requestFields, completionFields, statuses, transitions]
              properties:
                name: { $ref: '#/components/schemas/LocalizedText' }
                departmentId: { type: integer }
                defaultPriority: { type: string, enum: [low, medium, high] }
                acceptsExternalUsers: { type: boolean }
                acceptsEmployeeSubmitters:
                  type: boolean
                  description: whether an employee (not just a self-registered user) may submit to this service, e.g. Time Off
                autoAssign:
                  type: boolean
                  default: false
                  description: >
                    Opt-in (§13 re-scope). When true, a new request auto-picks
                    the least-loaded active employee in ownerId's subtree and
                    fires the workflow's assign-capability transition — a
                    no-op if the workflow has none. Toggle later via PATCH
                    /services/{id}/auto-assign.
                featureKey:
                  type: string
                  nullable: true
                  description: optional tag from the onboarding feature catalogue (lib/onboardingOptions.js), e.g. time_off, forms_checklists — lets clients tell same-flagged services apart

                ownerId: { type: integer, description: an existing employee — the Gate-2 visibility anchor }
                requestFields:
                  type: array
                  description: field_schema for the request form — see formSchema.js's FIELD_TYPES
                  items: { type: object }
                completionFields:
                  type: array
                  description: field_schema for the completion form
                  items: { type: object }
                statuses:
                  type: array
                  description: workflow statuses — see workflowSchema.js
                  items: { type: object }
                transitions:
                  type: array
                  items: { type: object }
      description: >
        Beyond the per-item rules, workflowSchema.js rejects three structural
        shapes outright, because a definition is frozen once a request uses it
        (S3) and each of these can strand a request permanently: a status no
        transition path reaches; a non-terminal status with no transition out
        of it; and an assign transition that also sets required_form_key
        (assignment is not completion, and neither path that fires it has a
        form to give). A workflow with NO assign transition is still valid -
        a self-service flow legitimately has none.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  serviceTypeId: { type: integer }
                  key: { type: string, description: auto-slugified from name.en, uniqueness-suffixed on collision }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /services/{id}:
    get:
      tags: [services]
      summary: >
        The whole service definition in one read - the row (including ownerId,
        which the summary omits), both form schemas, the workflow, and whether
        it is still editable. Admin-only, like the writes; backs the Add Service
        wizard's edit mode.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    allOf:
                      - $ref: '#/components/schemas/ServiceSummary'
                      - type: object
                        properties:
                          ownerId: { type: integer }
                          departmentId: { type: integer }
                          defaultPriority: { type: string, enum: [low, medium, high] }
                          editable:
                            type: boolean
                            description: false once any request has used this service (S3)
                          requestFields: { type: array, items: { type: object } }
                          completionFields: { type: array, items: { type: object } }
                          statuses: { type: array, items: { type: object } }
                          transitions: { type: array, items: { $ref: '#/components/schemas/TransitionDef' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [services]
      summary: >
        Edit a service that no request has used yet. S3's rule is "immutable
        once any request exists", not immutable from birth - before this there
        was no edit path at all, so a typo meant rebuilding the whole service.
        Takes the same body as POST /services and runs the same validation (a
        full replace, not a merge); `key` is never re-derived on rename. 409
        once any request exists - disable and recreate from there, as before.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: identical to the POST /services body
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  serviceTypeId: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The service already has requests - its definition is frozen }
        '422': { $ref: '#/components/responses/Validation' }

  /services/{id}/enabled:
    patch:
      tags: [services]
      summary: >
        Toggle a service on/off (admin-only). Not an edit endpoint — this is
        the whole mechanism behind the "definitions are immutable once live"
        rule (§3/§15): there is no route that could violate it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  enabled: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /services/{id}/auto-assign:
    patch:
      tags: [services]
      summary: >
        Toggle auto-assign on/off (admin-only, §13 re-scope). Unlike
        /enabled's neighbor, this isn't part of the immutable form/workflow
        definition — it only affects requests submitted after the toggle, so
        it's safe to flip on an already-live service.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autoAssign]
              properties:
                autoAssign: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  autoAssign: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /services/{serviceKey}/forms/{formKey}:
    get:
      tags: [services]
      summary: A form definition — the client renders each field by its `type`
      parameters:
        - { name: serviceKey, in: path, required: true, schema: { type: string } }
        - { name: formKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FieldDescriptor' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Requests — the generic lifecycle ────────────────────────────────────────
  /requests:
    post:
      tags: [requests]
      summary: Submit a request. Server validates `data` against the service's request form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_key, data]
              properties:
                service_key: { type: string }
                data: { type: object, description: "answers keyed by field id; validated server-side" }
                location: { $ref: '#/components/schemas/Point' }
      responses:
        '201':
          description: >
            Created — lands in workflow.initial_status; creation event
            written. If the service has auto_assign on (§13 re-scope) and
            picked someone, the request's status/task reflect that
            immediately and the body also carries a top-level assignedTask
            (null otherwise): { id, employeeId, employeeName, assignedAt }.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '422': { $ref: '#/components/responses/Validation' }
    get:
      tags: [requests]
      summary: List requests visible to the caller (own, if `user`; subtree-scoped, if `employee`)
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: status, in: query, schema: { type: string } }
        - { name: serviceKey, in: query, schema: { type: string } }
        - name: requesterRole
          in: query
          schema: { type: string, enum: [user, employee] }
          description: >
            Who submitted the request — external `user` vs internal `employee`
            (e.g. Time Off). Shared by GET /requests, GET /reports, and the
            CSV export via the one requestQuery.js filter engine.
        - name: slaBreached
          in: query
          schema: { type: string, enum: [true] }
          description: >
            Only open requests past their current status's sla_minutes — same
            definition as GET /dashboard/stats' slaBreaches count. Dashboard's
            SLA-breach tile links here.
        - name: reopened
          in: query
          schema: { type: string, enum: [true] }
          description: >
            Only requests whose history ever moved from an is_terminal status
            back to non-terminal — same definition as GET /dashboard/stats'
            reopenRate. Dashboard's reopen-rate tile links here.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Request' } }
                  total: { type: integer }

  /requests/{id}:
    get:
      tags: [requests]
      summary: One request with its immutable event timeline
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
        '404': { $ref: '#/components/responses/NotFound' }   # 404-over-403 for out-of-scope

  /requests/{id}/transitions:
    get:
      tags: [requests]
      summary: >
        Legal next actions from the current status AND permitted to this caller —
        BOTH gates already applied. The client renders exactly these buttons and
        nothing else.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transitions:
                    type: array
                    items: { $ref: '#/components/schemas/TransitionOption' }
    post:
      tags: [requests]
      summary: >
        Fire a transition. The ONE generic call — there is no /approve, /complete,
        /assign. Server re-checks: legal-from-status → Gate 1 (capability) →
        Gate 2 (target in subtree) → required form validates → status + audit row
        in one transaction → post_actions (notify, webhook).
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transition_key]
              properties:
                transition_key: { type: string }
                expected_status: { type: string, description: "optimistic concurrency; 409 if stale" }
                assignee_id: { type: integer, description: "when the transition assigns; must be in caller's subtree" }
                form: { type: object, description: "answers for required_form_key, if any" }
                note: { type: string }
      responses:
        '200':
          description: Transition fired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '403': { $ref: '#/components/responses/Forbidden' }    # Gate 1 or Gate 2 failed
        '409': { description: "Not legal from current status, or expected_status stale" }
        '422': { $ref: '#/components/responses/Validation' }   # required form invalid

  /requests/{id}/candidates:
    get:
      tags: [requests]
      summary: >
        Assignment candidates — the caller's subtree only, annotated with workload.
        Cross-branch assignment is unrepresentable because it never appears here.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Candidate' }

  # ── People / reporting tree ─────────────────────────────────────────────────
  # Every /employees route is gated by the manage_employees capability (Gate 1)
  # and scoped to the caller's subtree (Gate 2): a valid id outside the subtree,
  # a non-employee, or the caller themselves all return 404 (404-over-403).
  /employees:
    get:
      tags: [people]
      summary: >
        The caller's subtree employees (assignment picker + Employees page). Each
        row carries openTaskCount and avgResolutionMinutes for the workload view.
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: departmentId, in: query, required: false, schema: { type: integer } }
        - { name: workerType, in: query, required: false, schema: { type: string } }
        - name: isActive
          in: query
          required: false
          schema: { type: string, enum: [true, false] }
          description: >
            Unset returns both active and inactive (unchanged default —
            ReportsPage's employee filter relies on this to offer inactive
            employees, labelled). EmployeesPage defaults its own filter to
            isActive=true so deactivated staff don't clutter the normal view.
        - { name: q, in: query, required: false, schema: { type: string }, description: name or email substring }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items: { $ref: '#/components/schemas/EmployeeListItem' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '400': { description: Invalid query params }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [people]
      summary: >
        Create an employee. An oversight employee's hire becomes their direct
        report (manager_id = caller), inheriting the caller's department; the
        admin (no department/subtree of their own, I2) must supply
        departmentId and may supply managerId (omitted → the hire becomes a
        tree root) and levelId (admin-only — handing out a level grants real
        Gate-1 power). login_identifier is NOT supplied by the client — the
        server generates it as two letters of firstName + '.' + lastName +
        '@' + the company's email_domain (step 5 of onboarding), with a
        numeric suffix on collision (lib/employeeEmail.js). No password field
        either — the server always generates one and emails it (CLAUDE.md
        §13); it's also returned once here as `tempPassword`, same
        reveal-once shape as `login_identifier`, as a fallback if mail
        delivery is slow or down.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, phone, birthdate, gender, workerType]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                birthdate: { type: string, format: date }
                gender: { type: string }
                workerType: { type: string }
                weeklyRestDay: { type: integer, nullable: true, minimum: 0, maximum: 6 }
                departmentId: { type: integer, description: required when the caller is the admin }
                managerId: { type: integer, nullable: true, description: admin-only; omitted makes the hire a tree root }
                levelId: { type: integer, nullable: true, description: admin-only }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
                  tempPassword: { type: string, description: shown once — also emailed to the employee }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /employees/import/template:
    get:
      tags: [people]
      summary: A starter CSV with the exact columns POST /employees/import expects, one example row.
      responses:
        '200':
          description: CSV file
          content:
            text/csv: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /employees/import:
    post:
      tags: [people]
      summary: >
        Bulk hire from a CSV file (multipart, field `file`) — user-confirmed
        "partial success": every row is validated and inserted independently
        (reusing exactly the same rules POST /employees applies), so one bad
        row never blocks the rest of the file. No password column — each row
        gets a random temp password delivered only by the credentials email
        (§13), never echoed back here. department/manager/level columns
        (matched by name, case-insensitive) are read only for an admin
        caller — a non-admin's imported hires all land in their own
        department, under themselves, same restriction as POST /employees.
        Limited to 500 rows / 2 MB per file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Always 200 once the file itself parses — per-row results carry the actual outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRows: { type: integer }
                  createdCount: { type: integer }
                  failedCount: { type: integer }
                  created:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer, description: 1-indexed CSV row, header is row 1 }
                        employee: { $ref: '#/components/schemas/Employee' }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        errors: { type: object, additionalProperties: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: The file itself is missing, unparseable, empty, or too large/long — no rows were processed }

  /employees/{id}:
    patch:
      tags: [people]
      summary: >
        Edit an employee's name, phone, birthdate, gender, worker type,
        department, level, or weekly rest day. phone/birthdate/gender/
        workerType are required at creation (I8) — if given here they may
        change to another valid value but not to null (422). weeklyRestDay
        is the one still-optional field and keeps its null-clears-it shape.
        departmentId, if given, must equal the caller's own department
        (cross-department moves need an org-level actor that does not exist
        today). levelId is admin-only — silently ignored for any other
        caller, same as at creation (POST /employees) — and, if given, must
        reference an existing level; null clears it. managerId is likewise
        admin-only (2026-08-21 addition — previously an employee's manager
        could only change via a whole-department head reassignment): must
        reference an active employee and must not be inside this employee's
        own subtree (422 — would create a reporting cycle, same check as
        PATCH /departments/{id}/head); null makes them a tree root.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                birthdate: { type: string, format: date }
                gender: { type: string }
                workerType: { type: string }
                departmentId: { type: integer }
                levelId: { type: integer, nullable: true, description: admin-only }
                managerId: { type: integer, nullable: true, description: admin-only; must not create a reporting cycle }
                weeklyRestDay: { type: integer, nullable: true, minimum: 0, maximum: 6 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /employees/{id}/activate:
    patch:
      tags: [people]
      summary: Reactivate an employee.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /employees/{id}/deactivate:
    patch:
      tags: [people]
      summary: >
        Deactivate an employee. 409 if they still hold a task in a non-terminal
        status (finality read from the workflow data, no status key hardcoded) —
        reassign it first. If this employee heads a department, their own
        manager is auto-promoted to head (department.head_user_id) and every
        other department member's manager_id is re-pointed to the new head, so
        oversight never has a gap; if they have no active manager to fall back
        to, deactivation is refused (409) until the Owner reassigns the
        department's head first (PATCH /departments/{id}/head). A deactivated
        account's JWT stops working immediately.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': {
          description: Employee still holds an open task, or heads a department with no active manager to fall back to — reassign first,
        }

  /employees/{id}/reset-password:
    patch:
      tags: [people]
      summary: >
        Generate a temporary password for an employee, returned once (no forced
        change — documented MVP limitation). The old password stops working at once.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: Reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  tempPassword: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /employees/{id}/tasks:
    get:
      tags: [people]
      summary: One employee's tasks — a read-only oversight view of their assignments.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        requestId: { type: integer }
                        serviceTypeId: { type: integer }
                        serviceTypeName: { $ref: '#/components/schemas/LocalizedText' }
                        status: { $ref: '#/components/schemas/StatusView' }
                        priority: { type: string, enum: [low, medium, high] }
                        assignedAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /branches:
    get:
      tags: [people]
      summary: >
        List this company's branches (admin or view_all). Read-only —
        branches are created only by the onboarding wizard; this exists so
        the Departments page can populate a branch picker.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { $ref: '#/components/schemas/LocalizedText' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /departments:
    get:
      tags: [people]
      summary: >
        List departments. The admin sees all (with head + member count, for
        the Owner-only Departments page); an oversight employee (view_all)
        sees only their own department — keeps every department picker
        correct without client-side filtering.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  departments:
                    type: array
                    items: { $ref: '#/components/schemas/Department' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [people]
      summary: >
        Create a department (admin-only). Requires a head and at least one
        other employee — both are moved into the new department
        (department_id); every member other than the head also gets
        manager_id = head (Gate 2 — this is what gives the head real
        oversight of them). The head's own manager_id is left untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, headEmployeeId, memberEmployeeIds, branchId]
              properties:
                name: { $ref: '#/components/schemas/LocalizedText' }
                headEmployeeId: { type: integer }
                memberEmployeeIds:
                  type: array
                  items: { type: integer }
                  minItems: 1
                  description: must not include headEmployeeId
                branchId: { type: integer, description: must be one of this company's own branches }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  departmentId: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /departments/{id}:
    patch:
      tags: [people]
      summary: >
        Rename a department (admin-only), and optionally (re)assign its
        branch — also how the seed's branch-less "General" department gets
        one after onboarding creates branches.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/LocalizedText' }
                branchId: { type: integer, description: optional; must be one of this company's own branches }
      responses:
        '204': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [people]
      summary: >
        Delete a department (admin-only). Refused (409) while any employee or
        service_type still references it — move/reassign them first.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Department still has employees or services assigned to it }

  /departments/{id}/head:
    patch:
      tags: [people]
      summary: >
        Manually reassign a department's head (admin-only) — e.g. after the
        automatic on-deactivation fallback (PATCH /employees/{id}/deactivate)
        picked the outgoing head's manager and the Owner wants someone else.
        Moves the new head into the department and re-points every other
        current member's manager_id to them.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [headEmployeeId]
              properties:
                headEmployeeId: { type: integer }
      responses:
        '204': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  # ── Employee levels (Gate-1 configuration — Levels & Capabilities) ──────────
  # Reads: manage_employees or admin (backs the Add Employee role picker).
  # Writes: admin-only — handing out capabilities is real Gate-1 power. A
  # level's capabilities take effect immediately for every current holder, no
  # sign-out needed (requireAuth re-reads them from the DB every request).
  /employee-levels:
    get:
      tags: [people]
      summary: All levels with their granted capabilities and active holder count.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  levels:
                    type: array
                    items: { $ref: '#/components/schemas/EmployeeLevel' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [people]
      summary: Create a level (admin-only). Capabilities start empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/LocalizedText' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  level: { $ref: '#/components/schemas/EmployeeLevel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /employee-levels/{id}:
    patch:
      tags: [people]
      summary: >
        Rename a level and/or replace its full capability set (admin-only).
        capabilities, if given, must be a subset of the fixed capability
        catalogue and REPLACES the level's current grants entirely.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { $ref: '#/components/schemas/LocalizedText' }
                capabilities: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  level: { $ref: '#/components/schemas/EmployeeLevel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [people]
      summary: Delete a level (admin-only). 409 while any active employee still holds it.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Level still has active employees assigned to it }

  # ── Dashboard (oversight overview) ───────────────────────────────────────────
  /dashboard/stats:
    get:
      tags: [dashboard]
      summary: >
        Oversight overview stats, scoped to the actor's authority (Gate 2:
        subtree for an employee, company-wide for admin). Cross-service counts
        reason only on is_terminal, never a status key (§8/§9).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  avgResolutionMinutes: { type: integer, nullable: true }
                  byState:
                    type: array
                    items:
                      type: object
                      properties:
                        state: { type: string, enum: [open, closed] }
                        count: { type: integer }
                  byDepartment:
                    type: array
                    description: >
                      Sorted slowest-first by avgResolutionMinutes (nulls —
                      nothing resolved yet — sort last). By Service and By
                      Priority were dropped from this endpoint (2026-08-21):
                      both duplicated GET /reports' filterable/exportable
                      charts, so the dashboard no longer repeats them.
                    items:
                      type: object
                      properties:
                        departmentId: { type: integer }
                        name: { $ref: '#/components/schemas/LocalizedText' }
                        count: { type: integer }
                        avgResolutionMinutes: { type: integer, nullable: true }
                  byRequesterRole:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { type: string, enum: [user, employee] }
                        count: { type: integer }
                  slaBreaches:
                    type: object
                    description: Currently-open requests past their status's sla_minutes.
                    properties:
                      count: { type: integer }
                      rate: { type: number, nullable: true, description: "count / open total" }
                  reopenRate:
                    type: object
                    description: A request "reopened" if its history ever moves from an is_terminal status back to non-terminal.
                    properties:
                      reopened: { type: integer }
                      everClosed: { type: integer }
                      rate: { type: number, nullable: true }
                  workload:
                    type: object
                    description: Employees with open (non-terminal) tasks, subtree-scoped.
                    properties:
                      total: { type: integer, description: "Count before the top-8 truncation." }
                      top:
                        type: array
                        description: Top 8 by open task count.
                        items:
                          type: object
                          properties:
                            employeeId: { type: integer }
                            employeeName: { type: string }
                            openCount: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dashboard/chart:
    get:
      tags: [dashboard]
      summary: Requests created per day, last 30 days, split open/closed by current status.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        open: { type: integer }
                        closed: { type: integer }
                        count: { type: integer, description: "open + closed" }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Knowledge Base (communication feature group) ────────────────────────────
  # Read: company-wide, any admin/employee account (mobile employees have no
  # capabilities at all). Write: view_all or admin, same gate the console's
  # other authoring surfaces use.
  /knowledge-base:
    get:
      tags: [knowledge-base]
      summary: All of this company's articles, newest-updated first.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items: { $ref: '#/components/schemas/KbArticle' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [knowledge-base]
      summary: Create an article (view_all or admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { $ref: '#/components/schemas/LocalizedText' }
                body: { $ref: '#/components/schemas/LocalizedText' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  article: { $ref: '#/components/schemas/KbArticle' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /knowledge-base/{id}:
    get:
      tags: [knowledge-base]
      summary: One article.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  article: { $ref: '#/components/schemas/KbArticle' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [knowledge-base]
      summary: Edit an article's title and/or body (view_all or admin).
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { $ref: '#/components/schemas/LocalizedText' }
                body: { $ref: '#/components/schemas/LocalizedText' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  article: { $ref: '#/components/schemas/KbArticle' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [knowledge-base]
      summary: Delete an article (view_all or admin).
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Events (communication feature group) ────────────────────────────────────
  # Read: company-wide, any admin/employee. Write (create/edit/delete): view_all
  # or admin. RSVP: self-service, any admin/employee toggles their own row.
  /events:
    get:
      tags: [events]
      summary: All of this company's events, soonest-first. Includes attendeeCount and the caller's own isGoing.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [events]
      summary: Create an event (view_all or admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startsAt]
              properties:
                title: { $ref: '#/components/schemas/LocalizedText' }
                description: { $ref: '#/components/schemas/LocalizedText', nullable: true }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time, nullable: true }
                location: { type: string, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /events/{id}:
    get:
      tags: [events]
      summary: One event, including the attendee name list.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [events]
      summary: Edit an event (view_all or admin).
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { $ref: '#/components/schemas/LocalizedText' }
                description: { $ref: '#/components/schemas/LocalizedText', nullable: true }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time, nullable: true }
                location: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [events]
      summary: Delete an event (view_all or admin).
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/rsvp:
    post:
      tags: [events]
      summary: Self-service — mark the caller as attending (idempotent).
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '204': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [events]
      summary: Self-service — withdraw the caller's own RSVP (idempotent).
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '204': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Notifications ────────────────────────────────────────────────────────────
  /notifications:
    get:
      tags: [notifications]
      summary: Own notifications (rows, fetched on refresh — no websockets)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /notifications/{id}/read:
    patch:
      tags: [notifications]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '204': { description: Marked read }

  # ── Files ────────────────────────────────────────────────────────────────────
  /files:
    post:
      tags: [files]
      summary: >-
        Upload (multipart; requestId XOR taskId XOR neither for a parentless
        upload — a user's pending request photo, or the Owner's onboarding
        logo). Allowlist jpg/png/pdf, ≤5MB, magic-byte checked.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                requestId: { type: integer }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string, format: uuid } }
  /files/{id}:
    get:
      tags: [files]
      summary: Download (authorized per scope); served Content-Disposition attachment
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: File stream }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Translate (bilingual auto-fill assist) ──────────────────────────────────
  # Server-side proxy to Gemini (CLAUDE.md §13, 2026-08-21 exception), same
  # shape as the onboarding wizard's Nominatim geocode proxy. No write path of
  # its own — whichever endpoint actually saves the field still enforces I5/I8.
  /translate:
    post:
      tags: [translate]
      summary: Suggest the other side of a bilingual {en,ar} field pair from the text given. Any admin/employee account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, target]
              properties:
                text: { type: string, maxLength: 2000, description: The text already typed in the source language. }
                target: { type: string, enum: [en, ar], description: The language to translate into. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  translation: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '502': { description: The translation vendor errored or timed out }
        '503': { description: Translation is not configured on this deployment }

  /timeclock/shifts/active:
    get:
      tags: [timeclock]
      summary: The caller's own open shift (with its breaks and entries), or null. Employee only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { shift: { $ref: '#/components/schemas/TimeShift', nullable: true } }

  /timeclock/clock-in:
    post:
      tags: [timeclock]
      summary: Start a shift. Requires a one-shot device location fix. The coordinate is stored for the manager view (028_time_shift_clock_coordinates.sql, a deliberate I10 re-scope) alongside whether one was captured. 409 if already clocked in (DB-enforced, one active shift per employee).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location]
              properties:
                location:
                  type: object
                  required: [lat, lng]
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '201': { description: Clocked in, content: { application/json: { schema: { type: object, properties: { shift: { $ref: '#/components/schemas/TimeShift' } } } } } }
        '409': { description: Already clocked in }
        '422': { description: Missing or out-of-range location }

  /timeclock/clock-out:
    post:
      tags: [timeclock]
      summary: End the caller's active shift. 409 if not clocked in, or an active break isn't ended first. `location` is optional and best-effort (unlike clock-in) — a field employee without a device fix can still clock out; the coordinate is simply null.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                location:
                  type: object
                  nullable: true
                  required: [lat, lng]
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200': { description: Clocked out, content: { application/json: { schema: { type: object, properties: { shift: { $ref: '#/components/schemas/TimeShift' } } } } } }
        '409': { description: Not clocked in, or an active break is still open }
        '422': { description: location was provided but out-of-range/malformed }

  /timeclock/breaks/start:
    post:
      tags: [timeclock]
      summary: Start a break on the caller's active shift. 409 if not clocked in or a break is already active.
      responses:
        '201': { description: Break started, content: { application/json: { schema: { type: object, properties: { shift: { $ref: '#/components/schemas/TimeShift' } } } } } }
        '409': { description: Not clocked in, or a break is already active }

  /timeclock/breaks/end:
    post:
      tags: [timeclock]
      summary: End the active break on the caller's active shift. 409 if none is active.
      responses:
        '200': { description: Break ended, content: { application/json: { schema: { type: object, properties: { shift: { $ref: '#/components/schemas/TimeShift' } } } } } }
        '409': { description: Not clocked in, or no active break }

  /timeclock/shifts/manual:
    post:
      tags: [timeclock]
      summary: Backdated hours entry. Lands with approvalStatus 'pending' — a manager approves/edits it (later phase).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clockInAt, clockOutAt]
              properties:
                clockInAt: { type: string, format: date-time }
                clockOutAt: { type: string, format: date-time }
                note: { type: string }
      responses:
        '201': { description: Recorded pending approval, content: { application/json: { schema: { type: object, properties: { shift: { $ref: '#/components/schemas/TimeShift' } } } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /timeclock/shifts/{id}/entries:
    post:
      tags: [timeclock]
      summary: Add a note/photo/tip to the caller's own active shift. 404 if not their shift, 409 if not active.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [note, photo, tip] }
                body: { type: string, description: "required for type=note" }
                amount: { type: number, description: "required for type=tip" }
                fileAttachmentId: { type: string, format: uuid, description: "required for type=photo; a pending upload from POST /files owned by the caller" }
      responses:
        '201': { description: Entry added, content: { application/json: { schema: { type: object, properties: { shift: { $ref: '#/components/schemas/TimeShift' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Shift is not active }
        '422': { $ref: '#/components/responses/Validation' }

  /timeclock/today:
    get:
      tags: [timeclock]
      summary: >
        Manager Today view — one row per in-scope employee (their most recent
        shift on `date`) plus the 5 counters the web Today tab renders as
        clickable filters. Requires view_all (Gate 1) + scope (Gate 2: an
        oversight employee's subtree, or the whole company for the Owner, who
        has no subtree). Days are bucketed by the deployment's COMPANY_TZ.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, description: "defaults to today in COMPANY_TZ" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  employees: { type: array, items: { $ref: '#/components/schemas/TodayAttendance' } }
                  counters:
                    type: object
                    properties:
                      lateClockIns: { type: integer }
                      lateClockOuts: { type: integer }
                      attendance: { type: integer }
                      absences: { type: integer }
                      currentlyWorking: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /timeclock/timesheets:
    get:
      tags: [timeclock]
      summary: >
        Manager weekly timesheet grid — one row per in-scope employee (subtree, or
        the whole company for the Owner), 7 daily totals + weekly total/overtime.
        The week runs local-midnight to local-midnight in COMPANY_TZ.
      parameters:
        - { name: weekStart, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weekStart: { type: string, format: date }
                  timesheets: { type: array, items: { $ref: '#/components/schemas/Timesheet' } }
        '400': { description: weekStart missing or malformed }
        '403': { $ref: '#/components/responses/Forbidden' }

  /timeclock/timesheets/export.csv:
    get:
      tags: [timeclock]
      summary: Same weekly grid as GET /timeclock/timesheets, frozen CSV columns, for payroll. Requires view_all AND export.
      parameters:
        - { name: weekStart, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: CSV stream }
        '400': { description: weekStart missing or malformed }
        '403': { $ref: '#/components/responses/Forbidden' }

  /timeclock/shifts/{id}:
    patch:
      tags: [timeclock]
      summary: >
        Manager correction to a subtree employee's shift. Always lands
        status=completed, approvalStatus=edited. Requires manage_employees +
        subtree scope (404 if the shift's employee is outside it).
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clockInAt, clockOutAt]
              properties:
                clockInAt: { type: string, format: date-time }
                clockOutAt: { type: string, format: date-time }
                note: { type: string }
      responses:
        '200': { description: Edited, content: { application/json: { schema: { type: object, properties: { shift: { $ref: '#/components/schemas/TimeShift' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /timeclock/shifts/{id}/approve:
    post:
      tags: [timeclock]
      summary: Clears a pending manual entry's approval. 409 if the shift isn't pending. Requires manage_employees + subtree scope.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { description: Approved, content: { application/json: { schema: { type: object, properties: { shift: { $ref: '#/components/schemas/TimeShift' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Shift is not pending approval }

  /schedule/templates:
    get:
      tags: [schedule]
      summary: List the company's shift templates. Requires view_all.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { templates: { type: array, items: { $ref: '#/components/schemas/ShiftTemplate' } } } } } } }
    post:
      tags: [schedule]
      summary: Create a shift template. Requires manage_employees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startTime, endTime]
              properties:
                name: { $ref: '#/components/schemas/LocalizedText' }
                startTime: { type: string, example: "09:00" }
                endTime: { type: string, example: "17:00" }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { template: { $ref: '#/components/schemas/ShiftTemplate' } } } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /schedule/templates/{id}:
    patch:
      tags: [schedule]
      summary: >
        Edit a shift template. Requires manage_employees. The bilingual name is
        always editable, but startTime/endTime are frozen once the template has
        been used on a past date — Time Clock reads the current hours when it
        computes late/absent/overtime, so changing them would rewrite
        attendance history for days that already happened (409).
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { $ref: '#/components/schemas/LocalizedText' }
                startTime: { type: string }
                endTime: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, properties: { template: { $ref: '#/components/schemas/ShiftTemplate' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Hours are frozen — the template has already been worked on a past date }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [schedule]
      summary: Delete a shift template. 409 if it's used by any schedule_entry. Requires manage_employees.
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Template is used by scheduled shifts }

  /schedule/roster:
    get:
      tags: [schedule]
      summary: >
        Manager roster grid — one row per in-scope employee with every
        schedule_entry in [from, to]. Requires view_all (Gate 1) + scope
        (Gate 2: an oversight employee's subtree, or the whole company for the
        Owner, who has no subtree).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items:
                      type: object
                      properties:
                        employeeId: { type: integer }
                        name: { type: string }
                        entries:
                          type: array
                          items:
                            type: object
                            properties:
                              date: { type: string, format: date }
                              templateId: { type: integer }
                              templateName: { $ref: '#/components/schemas/LocalizedText' }
                              startTime: { type: string }
                              endTime: { type: string }
        '400': { description: from/to missing or malformed }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [schedule]
      summary: >
        Bulk upsert roster entries for subtree employees. templateId: null
        clears that employee's day. 404 if any employeeId is outside the
        caller's subtree. Requires manage_employees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [employeeId, date, templateId]
                    properties:
                      employeeId: { type: integer }
                      date: { type: string, format: date }
                      templateId: { type: integer, nullable: true }
      responses:
        '204': { description: Saved }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /schedule/mine:
    get:
      tags: [schedule]
      summary: The caller's own upcoming schedule entries in [from, to]. Employee only.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        templateId: { type: integer }
                        templateName: { $ref: '#/components/schemas/LocalizedText' }
                        startTime: { type: string }
                        endTime: { type: string }
        '400': { description: from/to missing or malformed }

  /checklists/stats:
    get:
      tags: [checklists]
      summary: >
        Per-checklist-template (service_type tagged feature_key =
        'forms_checklists') submitted/logged counts, today and all-time.
        Requires view_all (Gate 1) + subtree scope (Gate 2). No due-date/
        cadence engine exists, so this reports real counts, not an "expected
        count" ratio.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        serviceTypeId: { type: integer }
                        name: { $ref: '#/components/schemas/LocalizedText' }
                        submittedToday: { type: integer }
                        loggedToday: { type: integer }
                        submittedTotal: { type: integer }
                        loggedTotal: { type: integer }
                        lastSubmittedAt: { type: string, format: date-time, nullable: true }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer } }
    page: { name: page, in: query, schema: { type: integer, default: 1 } }
    pageSize: { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }

  responses:
    Unauthorized: { description: Missing/invalid/expired JWT, or deactivated account }
    Forbidden: { description: Gate 1 (capability) or Gate 2 (scope) failed }
    NotFound: { description: Not found — also returned for out-of-scope resources (404-over-403) }
    Conflict: { description: State conflict — e.g. duplicate handle, stale expected_status, or a one-shot action already done }
    Validation:
      description: Well-formed body failing validation — dynamic-form errors keyed by field id
      content:
        application/json:
          schema:
            type: object
            properties:
              errors: { type: object, additionalProperties: { type: string } }

  schemas:
    # Bilingual by construction — the DB physically rejects a label missing either key.
    LocalizedText:
      type: object
      required: [en, ar]
      properties:
        en: { type: string }
        ar: { type: string }

    KbArticle:
      type: object
      properties:
        id: { type: integer }
        title: { $ref: '#/components/schemas/LocalizedText' }
        body: { $ref: '#/components/schemas/LocalizedText' }
        createdBy: { type: integer }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Event:
      type: object
      properties:
        id: { type: integer }
        title: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText', nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        location: { type: string, nullable: true }
        createdBy: { type: integer }
        createdByName: { type: string }
        attendeeCount: { type: integer }
        attendeeNames: { type: array, items: { type: string }, description: only present on GET /events/{id} }
        isGoing: { type: boolean }

    EmployeeLevel:
      type: object
      properties:
        id: { type: integer }
        name: { $ref: '#/components/schemas/LocalizedText' }
        capabilities: { type: array, items: { type: string } }
        holderCount: { type: integer }

    Department:
      type: object
      properties:
        id: { type: integer }
        name: { $ref: '#/components/schemas/LocalizedText' }
        headUserId: { type: integer, nullable: true }
        headName: { type: string, nullable: true }
        branchId: { type: integer, nullable: true }
        branchName: { $ref: '#/components/schemas/LocalizedText' }
        memberCount: { type: integer }

    Point:
      type: object
      description: PostGIS GEOGRAPHY(Point,4326)
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    Account:
      type: object
      description: >
        Three account kinds only — admin | employee | user. There is no "monitor".
        Oversight is a matter of level + subtree, not a role name.
      properties:
        id: { type: integer }
        kind: { type: string, enum: [admin, employee, user] }
        name: { type: string }
        login_identifier: { type: string }
        level: { $ref: '#/components/schemas/Level' }        # employees only
        manager_id: { type: integer, nullable: true }        # employees only
        capabilities:
          type: array
          items: { type: string }
          description: "resolved from level_capability — for UX only; server re-checks"

    Employee:
      type: object
      description: An employee as returned by the /employees write routes.
      properties:
        id: { type: integer }
        name: { type: string }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true, description: "required on new hires (POST/PATCH); nullable only for rows created before that rule" }
        loginIdentifier: { type: string, description: the generated sign-in email (or, for pre-existing rows, the legacy 4-digit number) }
        isActive: { type: boolean }
        birthdate: { type: string, format: date, nullable: true, description: "required on new hires (POST/PATCH); nullable only for rows created before that rule" }
        gender: { type: string, nullable: true, description: "machine key, e.g. 'male'/'female' — required on new hires (POST/PATCH); nullable only for rows created before that rule" }
        workerType: { type: string, nullable: true, description: "machine key, e.g. 'full_time'/'part_time'/'contractor' — required on new hires (POST/PATCH); nullable only for rows created before that rule" }
        weeklyRestDay: { type: integer, nullable: true, minimum: 0, maximum: 6, description: "one fixed day off/week, 0=Sunday..6=Saturday — respected by /schedule/suggest" }
        departmentId: { type: integer, nullable: true }
        departmentName: { $ref: '#/components/schemas/LocalizedText' }
        branchId: { type: integer, nullable: true, description: derived from the employee's department, not settable directly }
        branchName: { $ref: '#/components/schemas/LocalizedText' }
        levelId: { type: integer, nullable: true }
        levelName: { $ref: '#/components/schemas/LocalizedText' }
        managerId: { type: integer, nullable: true, description: "null = a tree root" }

    EmployeeListItem:
      type: object
      description: A GET /employees row — an Employee plus workload metrics.
      allOf:
        - { $ref: '#/components/schemas/Employee' }
        - type: object
          properties:
            openTaskCount: { type: integer, description: tasks in a non-terminal status }
            avgResolutionMinutes: { type: integer, nullable: true, description: avg create→resolve minutes, null if none resolved }

    StatusView:
      type: object
      description: The API-shaped status a client renders directly (no status key logic).
      properties:
        key: { type: string }
        label: { $ref: '#/components/schemas/LocalizedText' }
        isTerminal: { type: boolean }

    Level:
      type: object
      properties:
        id: { type: integer }
        name: { $ref: '#/components/schemas/LocalizedText' }

    ServiceSummary:
      type: object
      description: >
        A service row (GET /services). id is present so the console can read the
        stored definition back through GET /services/{id}/workflow and
        /services/{id}/forms/{formType}.
      properties:
        id: { type: integer }
        key: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        departmentName: { $ref: '#/components/schemas/LocalizedText' }
        ownerLogin: { type: string, nullable: true }
        ownerName: { type: string, nullable: true }
        enabled: { type: boolean }
        acceptsExternalUsers: { type: boolean }
        acceptsEmployeeSubmitters: { type: boolean }
        autoAssign: { type: boolean }
        featureKey: { type: string, nullable: true }
        editable:
          type: boolean
          description: >
            false once any request has used this service, i.e. its definition is
            frozen (S3). Drives the console Services page's Edit affordance.

    TransitionDef:
      type: object
      description: >
        One-way directed edge. Backward moves (reassign, reopen) are just extra
        rows — the engine has no concept of a loop. Gated by EXACTLY ONE of
        required_capability (an oversight capability, Gate 1) or actor (the
        party whose turn it is) — seed-time enforced.
      required: [key, label, from, to]
      properties:
        key: { type: string }
        label: { $ref: '#/components/schemas/LocalizedText' }
        from: { type: string }
        to: { type: string }
        required_capability: { type: string, nullable: true, description: "Gate 1" }
        actor:
          type: string
          nullable: true
          enum: [requester, assignee]
          description: "the party whose turn it is; null on capability-gated transitions"
        required_form_key: { type: string, nullable: true, description: "validator" }
        requires_note: { type: boolean, description: "422 without a note" }
        notify:
          type: array
          description: >
            Phase 5: notification targets as RELATIONSHIPS, resolved at fire
            time (replaces the interim notify_oversight boolean). Webhook
            post_actions remain Phase 7.
          items:
            type: string
            enum: [created_by, assigned_to, assignee_manager]

    TransitionOption:
      type: object
      description: >
        A transition the caller may fire right now (both gates already
        applied). Response fields are camelCase like every other response
        body. requires_assignee arrives with assignee-as-transition (Phase
        5/7); until then assignment stays on PATCH /requests/{id}/assign.
      properties:
        key: { type: string }
        label: { $ref: '#/components/schemas/LocalizedText' }
        to: { type: string }
        toLabel: { $ref: '#/components/schemas/LocalizedText' }
        toTerminal: { type: boolean, description: "destructive-styling hint" }
        requiresNote: { type: boolean }
        requiredFormKey: { type: string, nullable: true }

    FieldDescriptor:
      type: object
      required: [id, label, type]
      properties:
        id: { type: string }
        label: { $ref: '#/components/schemas/LocalizedText' }
        type: { type: string, enum: [text, multiline, number, date, dropdown, radio, checkbox, photo, location] }
        required: { type: boolean }
        options:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { $ref: '#/components/schemas/LocalizedText' }
        min: { type: number }
        max: { type: number }
        visible_to_employee: { type: boolean }

    Request:
      type: object
      properties:
        id: { type: integer }
        service_key: { type: string }
        status: { type: string }
        status_label: { $ref: '#/components/schemas/LocalizedText' }
        priority: { type: string, enum: [low, medium, high] }
        data: { type: object }
        location: { $ref: '#/components/schemas/Point' }
        assigned_to: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    RequestDetail:
      allOf:
        - $ref: '#/components/schemas/Request'
        - type: object
          properties:
            timeline:
              type: array
              items: { $ref: '#/components/schemas/Event' }

    Event:
      type: object
      description: request_event — immutable, never updated or deleted; written in the status-change transaction
      properties:
        id: { type: integer }
        actor_id: { type: integer }
        transition_key: { type: string, nullable: true }
        to_status: { type: string }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Candidate:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        open_workload: { type: integer, description: "outcome metric, not behaviour tracking" }

    TimeShift:
      type: object
      properties:
        id: { type: integer }
        clockInAt: { type: string, format: date-time }
        clockOutAt: { type: string, format: date-time, nullable: true }
        source: { type: string, enum: [clock, manual] }
        status: { type: string, enum: [active, completed] }
        approvalStatus: { type: string, enum: [pending, approved, edited] }
        note: { type: string, nullable: true }
        locationCaptured: { type: boolean, description: Whether a device location fix was captured at clock-in — false for manual/edited entries, which have no live clock-in moment. }
        clockInLocation:
          type: object
          nullable: true
          description: "Coordinate captured at clock-in (028_time_shift_clock_coordinates.sql, deliberate I10 re-scope — manager-visible single point, not a history). Null for manual/edited entries."
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        clockOutLocation:
          type: object
          nullable: true
          description: "Coordinate captured at clock-out. Best-effort, unlike clock-in — null whenever no device fix was available, not an error."
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        breaks:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              breakStartAt: { type: string, format: date-time }
              breakEndAt: { type: string, format: date-time, nullable: true }
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              type: { type: string, enum: [note, photo, tip] }
              body: { type: string, nullable: true }
              amount: { type: number, nullable: true }
              attachmentId: { type: string, format: uuid, nullable: true }
              createdAt: { type: string, format: date-time }

    TodayAttendance:
      type: object
      description: One subtree employee's Today-tab row, with the flags backing the 5 clickable counters.
      properties:
        employeeId: { type: integer }
        name: { type: string }
        shiftId: { type: integer, nullable: true }
        clockInAt: { type: string, format: date-time, nullable: true }
        clockOutAt: { type: string, format: date-time, nullable: true }
        clockInLocation:
          type: object
          nullable: true
          description: "See TimeShift.clockInLocation."
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        clockOutLocation:
          type: object
          nullable: true
          description: "See TimeShift.clockOutLocation (best-effort)."
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        breakStartAt: { type: string, format: date-time, nullable: true, description: "first break of the shift only" }
        breakEndAt: { type: string, format: date-time, nullable: true }
        breakSeconds: { type: integer }
        approvalStatus: { type: string, enum: [pending, approved, edited], nullable: true }
        source: { type: string, enum: [clock, manual], nullable: true }
        totalHours: { type: number, nullable: true }
        overtimeHours: { type: number, nullable: true, description: "null when no schedule_entry exists for this date" }
        lateClockIn: { type: boolean }
        lateClockOut: { type: boolean }
        absent: { type: boolean }
        currentlyWorking: { type: boolean }

    Timesheet:
      type: object
      description: One in-scope employee's weekly row — 7 daily totals plus weekly aggregates.
      properties:
        employeeId: { type: integer }
        name: { type: string }
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            properties:
              totalHours: { type: number }
              overtimeHours: { type: number }
              unclosed:
                type: boolean
                description: >-
                  True when a shift on this day was never clocked out. Its hours
                  are capped at 24h rather than accruing against now(), and the
                  web grid marks the cell so a manager can correct the clock-out.
              shifts:
                type: array
                description: The shift(s) that landed on this day — drives the edit/approve actions in the web Timesheets tab.
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    clockInAt: { type: string, format: date-time }
                    clockOutAt: { type: string, format: date-time, nullable: true }
                    clockInLocation:
                      type: object
                      nullable: true
                      description: "See TimeShift.clockInLocation."
                      properties:
                        lat: { type: number, minimum: -90, maximum: 90 }
                        lng: { type: number, minimum: -180, maximum: 180 }
                    clockOutLocation:
                      type: object
                      nullable: true
                      description: "See TimeShift.clockOutLocation (best-effort)."
                      properties:
                        lat: { type: number, minimum: -90, maximum: 90 }
                        lng: { type: number, minimum: -180, maximum: 180 }
                    approvalStatus: { type: string, enum: [pending, approved, edited] }
                    source: { type: string, enum: [clock, manual] }
        weeklyTotalHours: { type: number }
        weeklyOvertimeHours: { type: number }

    # An endTime at or before startTime means the shift crosses midnight (a
    # 17:00–01:00 night); Time Clock's duration and late-clock-out math handle
    # the wraparound (lib/timeClock.js).
    ShiftTemplate:
      type: object
      properties:
        id: { type: integer }
        name: { $ref: '#/components/schemas/LocalizedText' }
        startTime: { type: string, example: "09:00:00" }
        endTime: { type: string, example: "17:00:00" }

    Notification:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        message: { $ref: '#/components/schemas/LocalizedText' }
        is_read: { type: boolean }
        request_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
